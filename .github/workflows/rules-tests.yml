name: Rules Tests

on:
  push:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - '.github/workflows/rules-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'database.rules.json'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'firebase.json'
      - '.github/workflows/rules-tests.yml'
  workflow_dispatch:

jobs:
  test:
    name: Mocha against Firebase RTDB Emulator
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Java (required by Firebase Emulator)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run rules tests
        run: npm test
